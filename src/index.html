<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haunted House</title>
    <!-- Make sure this path is correct for your project structure -->
    <link rel="stylesheet" href="./style2.css">
</head>
<body>
    <canvas class="webgl"></canvas>

    <!-- Instructions Button (Always Visible) -->
    <button id="show-instructions-btn" class="info-btn">?</button>

    <!-- Loading Screen -->
    <div class="loading-screen" id="loading-screen">
        <div class="loading-text">Loading...</div>
        <div class="loading-bar-container">
            <div class="loading-bar"></div>
        </div>
    </div>

    <!-- Instructions Screen -->
    <div id="instructions-screen" class="overlay hidden">
        <div class="instructions-content">
            <!-- Using a consistent close button -->
            <button id="close-instructions-btn" class="close-btn">&times;</button>
            <h2>How to Explore</h2>
            <p>Welcome to the Haunted House!</p>
            <ul>
                <li><b>Left-Click :</b> Look around the scene.</li>
                <li><b>Right-Click :</b> Drag the screen .</li>
                <li><b>Mouse Wheel:</b> Zoom in and out.</li>
                <li>Use the <b>GUI Manipulation panel</b> to tweak lighting and other effects.</li>
            </ul>
        </div>
    </div>

    <!-- Make sure this path is correct for your project structure -->
    <script type="module" src="./script.js"></script>
</body>
</html>
